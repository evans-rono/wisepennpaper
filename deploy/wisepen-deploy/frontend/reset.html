<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/theme.js"></script><title>Reset password | Wise Pen N’ Paper</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/dashboard.css"></head>
<body><button type="button" class="theme-toggle theme-toggle-fixed" id="themeToggle" aria-pressed="false" aria-label="Switch to dark theme"><span class="moon" aria-hidden="true">☾</span><span class="sun" aria-hidden="true">☀</span></button>
<main class="auth-shell"><div class="auth-card"><div class="brand" role="img" aria-label="The Wise Pen N’ Paper"><svg class="logo" viewBox="0 0 1330 312" aria-hidden="true" focusable="false"><use href="#logo"/></svg></div><p class="eyebrow">Password reset</p><h1>Choose a new password</h1><p class="auth-sub">Enter the six-digit code we emailed you, then set a new password. The code expires 30 minutes after it was sent.</p><form id="resetForm"><label>Email verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>New password<input name="new_password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required data-pw-meter></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required data-pw-confirm="new_password"></label><button class="btn" type="submit">Reset password</button><p class="form-status" role="status"></p></form><p class="auth-foot"><a href="/portal">Back to sign in</a></p></div></main><script type="module" src="/reset.js"></script></body></html>
