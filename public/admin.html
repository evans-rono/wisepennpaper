<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wise Pen Admin</title><link rel="stylesheet" href="/styles.css"><style>.shell{min-height:100vh;background:#eef2ec}.dash-head{padding:1.2rem 4vw;background:#142318;color:#fff;display:flex;justify-content:space-between}.dash{padding:3rem 4vw}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem}.metric{background:#fff;padding:1.2rem;border-radius:14px}.metric b{font-size:2rem;display:block}.tabs{display:flex;gap:1rem;margin:2rem 0}.table-wrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:.8rem;text-align:left;border-bottom:1px solid #eee}.login{max-width:480px;margin:12vh auto}.hidden{display:none}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body class="shell"><main id="login" class="panel login"><h1>Admin sign in</h1><p>Secure access for Wise Pen staff.</p><form id="loginForm"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Sign in</button><p class="form-status"></p></form></main><div id="app" class="hidden"><header class="dash-head"><b>Wise Pen Business Manager</b><button id="logout" class="btn small">Sign out</button></header><main class="dash"><h1>Dashboard</h1><div id="metrics" class="metrics"></div><div class="tabs"><button class="btn" data-tab="quotes">Quote requests</button><button class="btn ghost" data-tab="appointments">Appointments</button><button class="btn ghost" data-tab="messages">Contact messages</button><button class="btn ghost" data-tab="services">Services</button></div><section id="content"></section></main></div><script src="/admin.js"></script></body></html>
