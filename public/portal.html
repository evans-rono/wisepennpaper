<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wise Pen Client Portal</title><link rel="stylesheet" href="/styles.css"><style>.portal{max-width:1100px;margin:auto;padding:4rem 5vw}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.hidden{display:none}.progress{height:10px;background:#dce5dd;border-radius:9px}.progress i{display:block;height:100%;background:#245f40;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="brand" href="/"><span>W</span><b>Wise Pen Client Portal</b></a><a href="/">Public website</a></header><main class="portal"><section id="auth"><h1>Client access</h1><div class="grid"><form id="login" class="panel"><h2>Sign in</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p class="form-status"></p></form><form id="register" class="panel"><h2>Create account</h2><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Password<input name="password" type="password" minlength="10" required></label><button class="btn">Create account</button><p class="form-status"></p></form></div></section><section id="portal" class="hidden"><div style="display:flex;justify-content:space-between"><h1>My projects</h1><button id="logout" class="btn ghost">Sign out</button></div><div id="projects" class="grid"></div><h2>Quote requests</h2><div id="quotes" class="grid"></div><h2>Appointments</h2><div id="appointments" class="grid"></div><h2>Invoices</h2><div id="invoices" class="grid"></div></section></main><script src="/portal.js"></script></body></html>
