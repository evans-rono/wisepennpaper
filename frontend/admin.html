<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script src="/theme.js"></script>
<title>Wise Pen Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/dashboard.css">
</head>
<!-- data-state is set by the server from the session, so the right panel is
     painted immediately rather than flashing the sign-in form at staff who are
     already signed in. -->
<body class="shell" data-state="signed-out">
<button type="button" class="theme-toggle theme-toggle-fixed" id="themeToggle" aria-pressed="false" aria-label="Switch to dark theme"><span class="moon" aria-hidden="true">☾</span><span class="sun" aria-hidden="true">☀</span></button>

<main id="login" class="login">
  <div class="panel">
    <div class="brand login-brand" role="img" aria-label="The Wise Pen N’ Paper"><svg class="logo" viewBox="0 0 1330 312" aria-hidden="true" focusable="false"><use href="/logo.svg#logo"/></svg></div>
    <h1>Staff sign in</h1>

    <form id="loginForm" novalidate>
      <p class="field-help">Client accounts sign in at the <a href="/portal">client portal</a>.</p>
      <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Continue</button>
      <button class="btn ghost" type="button" id="forgotPassword">Forgot password?</button>
      <p class="form-status" role="status"></p>
    </form>

      <div class="sso" hidden data-google>
        <div class="sso-divider"><span>or</span></div>
        <a class="btn ghost sso-btn" href="/api/auth/google">
          <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.3-.2-1.9H9v3.5h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/>
            <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.6-1.9.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3z"/>
            <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/>
          </svg>
          Continue with Google
        </a>
      </div>
    <!-- Second step, revealed only once the password has been accepted. -->
    <form id="twoFactorForm" hidden novalidate>
      <h2>Two-step verification</h2>
      <p class="field-help">Enter the six-digit code from your authenticator app, or one of your recovery codes.</p>
      <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" spellcheck="false"
        placeholder="123456" required aria-describedby="codeHelp"></label>
      <small id="codeHelp" class="field-help">A recovery code looks like ABCDE-12345.</small>
      <div class="form-row">
        <button class="btn" type="submit">Verify and sign in</button>
        <button class="btn ghost" type="button" data-restart>Start again</button>
      </div>
      <p class="form-status" role="status"></p>
    </form>
  </div>
</main>

<div id="app">
  <header class="dash-head">
    <div class="dash-brand"><b>Wise Pen Business Manager</b><small id="whoami"></small></div>
    <button id="logout" type="button" class="btn small">Sign out</button>
  </header>

  <main class="dash">
    <h1>Dashboard</h1>
    <div id="metrics" class="metrics"></div>

    <div class="tabs" role="tablist" aria-label="Dashboard sections">
      <button type="button" class="btn" data-tab="quotes" role="tab" id="tab-quotes" aria-controls="panel" aria-selected="true">Quote requests</button>
      <button type="button" class="btn ghost" data-tab="appointments" role="tab" id="tab-appointments" aria-controls="panel" aria-selected="false" tabindex="-1">Appointments</button>
      <button type="button" class="btn ghost" data-tab="messages" role="tab" id="tab-messages" aria-controls="panel" aria-selected="false" tabindex="-1">Messages</button>
      <button type="button" class="btn ghost" data-tab="projects" role="tab" id="tab-projects" aria-controls="panel" aria-selected="false" tabindex="-1">Projects</button>
      <button type="button" class="btn ghost" data-tab="services" role="tab" id="tab-services" aria-controls="panel" aria-selected="false" tabindex="-1">Services</button>
      <button type="button" class="btn ghost" data-tab="portfolio" role="tab" id="tab-portfolio" aria-controls="panel" aria-selected="false" tabindex="-1">Portfolio</button>
      <button type="button" class="btn ghost" data-tab="testimonials" role="tab" id="tab-testimonials" aria-controls="panel" aria-selected="false" tabindex="-1">Testimonials</button>
      <button type="button" class="btn ghost" data-tab="faqs" role="tab" id="tab-faqs" aria-controls="panel" aria-selected="false" tabindex="-1">FAQs</button>
      <button type="button" class="btn ghost" data-tab="blog" role="tab" id="tab-blog" aria-controls="panel" aria-selected="false" tabindex="-1">Articles</button>
      <button type="button" class="btn ghost" data-tab="settings" role="tab" id="tab-settings" aria-controls="panel" aria-selected="false" tabindex="-1" hidden>Site details</button>
      <button type="button" class="btn ghost" data-tab="team" role="tab" id="tab-team" aria-controls="panel" aria-selected="false" tabindex="-1" hidden>Team</button>
      <button type="button" class="btn ghost" data-tab="security" role="tab" id="tab-security" aria-controls="panel" aria-selected="false" tabindex="-1">Security</button>
      <button type="button" class="btn ghost" data-tab="audit" role="tab" id="tab-audit" aria-controls="panel" aria-selected="false" tabindex="-1" hidden>Activity log</button>
    </div>

    <section id="panel" role="tabpanel" aria-labelledby="tab-quotes" tabindex="0"></section>
  </main>
</div>

<!-- One editor serves every content type; the fields are built per type. -->
<dialog class="modal" id="editorModal" aria-labelledby="editorTitle">
  <div class="modal-card">
    <button type="button" class="close" aria-label="Close">×</button>
    <h2 id="editorTitle">Edit</h2>
    <form id="editorForm"><div id="editorFields"></div>
      <button class="btn" type="submit">Save</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>
</dialog>

<!-- The full record behind a dashboard row, including the attached files. -->
<dialog class="modal" id="quoteModal" aria-labelledby="quoteModalTitle">
  <div class="modal-card">
    <button type="button" class="close" aria-label="Close">×</button>
    <h2 id="quoteModalTitle">Quote request</h2>
    <div id="quoteDetail"></div>
  </div>
</dialog>

<!--ssr:boot--><!--/ssr:boot-->
<script src="/admin.js" type="module"></script>
</body>
</html>
