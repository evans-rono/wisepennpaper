<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/theme.js"></script><title>Reset password | Wise Pen N’ Paper</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/dashboard.css"></head>
<body><main class="login"><div class="panel"><h1>Choose a new password</h1><p>Enter the six-digit verification code sent to your email, then choose a new password.</p><form id="resetForm"><label>Email verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>New password<input name="new_password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label><button class="btn" type="submit">Reset password</button><p class="form-status" role="status"></p></form></div></main><script type="module" src="/reset.js"></script></body></html>
